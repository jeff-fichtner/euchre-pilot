[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "euchre-pilot"
version = "0.1.0"
description = "Euchre AI agent: screen-reading player, game recorder, and LLM-powered analyst"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8",
    "numpy>=1.24",
    "Pillow>=10.0",
    "pydantic>=2.0",
    "instructor>=1.0",
    "anthropic>=0.30",
    "openai>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.3",
    "mypy>=1.8",
]

[project.scripts]
euchre-calibrate = "euchre_pilot.cli:calibrate"
euchre-play = "euchre_pilot.cli:play"
euchre-simulate = "euchre_pilot.cli:simulate"
euchre-analyze = "euchre_pilot.cli:analyze"
euchre-dashboard = "euchre_pilot.cli:dashboard"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
